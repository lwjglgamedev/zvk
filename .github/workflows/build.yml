name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chapter:
          - chapter-01
          - chapter-02
          - chapter-03
          - chapter-04
          - chapter-05
          - chapter-06
          - chapter-07
          - chapter-08
          - chapter-09
          - chapter-10
          - chapter-11
          - chapter-12
          - chapter-13
          - chapter-14
          - chapter-15
          - chapter-16
          - chapter-17
          - chapter-18
          - chapter-19
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Cache Zig package cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/zig
          key: zig-deps-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            zig-deps-

      - name: Install glslc (shaderc)
        run: sudo apt-get update && sudo apt-get install -y glslc

      - name: Build ${{ matrix.chapter }}
        working-directory: booksamples/${{ matrix.chapter }}
        run: zig build

  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Check formatting
        run: zig fmt --check .